<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Controle Financeiro</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#171923}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:white;padding:22px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;margin-bottom:30px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px;border-radius:10px;margin:4px 0}.nav button.active,.nav button:hover{background:#263244;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{margin:0;font-size:28px}.primary{background:#111827;color:#fff;padding:12px 17px;border-radius:11px;font-weight:700}.secondary{background:#eef0f4;padding:11px 15px;border-radius:10px}.danger{background:#fee2e2;color:#991b1b;padding:11px 15px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid #e8eaf0;border-radius:16px;padding:18px;box-shadow:0 3px 15px #11182708}.label{font-size:13px;color:#6b7280}.value{font-size:25px;font-weight:800;margin-top:7px}.green{color:#16805b}.red{color:#c24141}.charts{display:grid;grid-template-columns:1.25fr 1fr;gap:15px;margin-top:15px}.chart{min-height:300px}.bars{display:flex;align-items:end;gap:10px;height:220px;padding:20px 0 28px}.bar{flex:1;background:#111827;border-radius:7px 7px 2px 2px;min-height:4px;position:relative}.bar span{position:absolute;bottom:-25px;width:100%;text-align:center;font-size:10px;color:#6b7280;overflow:hidden;text-overflow:ellipsis}.insight{padding:13px;border-radius:11px;background:#f3f4f6;margin-top:10px}.section{margin-top:20px}.section h2{font-size:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee;font-size:14px}.pill{padding:5px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.empty{color:#6b7280;padding:35px;text-align:center}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%)}.form{display:grid;gap:12px}.form input,.form select{width:100%;padding:12px;border:1px solid #d7dbe3;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.tools input,.tools select{padding:10px;border:1px solid #d7dbe3;border-radius:9px;max-width:100%}.tablewrap{overflow-x:auto}.table{min-width:650px}.tiny{padding:7px 9px;border-radius:8px;background:#eef0f4;margin-right:4px}.modalbox{max-height:92vh;overflow:auto}.mobile{display:none}.notice{padding:10px 13px;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;border-radius:10px;font-size:13px}
.progress{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:#111827}.stack{display:grid;gap:10px}.flexline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#64748b;font-size:13px}.field{padding:10px;border:1px solid #d7dbe3;border-radius:9px;max-width:100%}.warn{color:#b45309}.overdue{color:#b91c1c}.minihead{font-weight:700;margin-bottom:8px}.tools label{font-size:13px}.tools input[type=month]{max-width:180px}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:18px 14px 85px}.grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;z-index:4;justify-content:space-around;padding:9px}.mobile button{background:transparent;font-size:12px}.top h1{font-size:22px}}
@media(max-width:520px){.value{font-size:20px}.row{grid-template-columns:1fr}.top{align-items:flex-start}.top .primary{padding:10px}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Controle">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
<div class="app">
<aside class="side"><div class="brand">💰 Meu Controle</div><div class="nav">
<button class="active" onclick="show('dashboard',this)">🏠 Início</button>
<button onclick="show('transactions',this)">📋 Movimentações</button>
<button onclick="show('reports',this)">📊 Relatórios</button><button onclick="show('planning',this)">📅 Contas a pagar</button><button onclick="show('accounts',this)">💳 Contas e orçamentos</button>
<button onclick="show('goals',this)">🎯 Metas</button>
<button onclick="show('settings',this)">⚙️ Configurações</button>
</div></aside>
<main class="main">
<div class="top"><div><h1 id="title">Visão geral</h1><div class="label" id="month"></div></div><button class="primary" onclick="openModal()">＋ Novo lançamento</button></div>
<section id="dashboard"></section><section id="planning" style="display:none"></section><section id="accounts" style="display:none"></section><section id="transactions" style="display:none"></section><section id="reports" style="display:none"></section><section id="goals" style="display:none"></section><section id="settings" style="display:none"></section>
</main></div>
<nav class="mobile"><button onclick="show('dashboard')">🏠<br>Início</button><button onclick="openModal()">➕<br>Adicionar</button><button onclick="show('transactions')">📋<br>Gastos</button><button onclick="show('planning')">📅<br>Vencimentos</button><button onclick="show('settings')">⚙️<br>Ajustes</button></nav>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">Novo lançamento</h2><form class="form" onsubmit="saveTx(event)">
<input type="hidden" id="editId"><div class="row"><select id="type"><option value="expense">Despesa</option><option value="income">Receita</option></select><input id="amount" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required></div>
<div class="row"><select id="category"></select><input id="date" type="date" required></div>
<input id="description" placeholder="Descrição (ex.: gasolina)">
<select id="payment"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Conta bancária</option></select>
<div class="row"><select id="txAccount" aria-label="Conta financeira"></select><select id="txStatus" aria-label="Situação"><option value="paid">Pago / recebido</option><option value="pending">Pendente</option></select></div><label><input id="recurring" type="checkbox"> Recorrente (informativo; não gera parcelas automaticamente)</label>
<div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button class="primary">Salvar</button></div></form></div></div>
<script>
const defaultCats=['Moto','Gasolina','Manutenção','Padaria','Farmácia','Supermercado','Alimentação','Casa','Contas','Transporte','Compras','Lazer','Assinaturas','Cartão','Outros','Salário','Freelance','Vendas','Pix recebido','Aluguel','Carro','Pedidos'];
let cats=JSON.parse(localStorage.getItem('mcf_categories')||'null')||defaultCats.slice();
let data=JSON.parse(localStorage.getItem('mcf_data')||'[]');
let goals=JSON.parse(localStorage.getItem('mcf_goals')||'[]');
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
date.value=today;
function save(){localStorage.setItem('mcf_data',JSON.stringify(data));localStorage.setItem('mcf_goals',JSON.stringify(goals));localStorage.setItem('mcf_categories',JSON.stringify(cats))}
function monthData(){let p=new Date();return data.filter(x=>{let d=new Date(x.date);return d.getMonth()==p.getMonth()&&d.getFullYear()==p.getFullYear()})}
function calc(){let m=monthData(),inc=m.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),exp=m.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);return {m,inc,exp,bal:inc-exp}}
function render(){
 document.getElementById('month').textContent=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 let {m,inc,exp,bal}=calc(),by={};m.filter(x=>x.type==='expense').forEach(x=>by[x.category]=(by[x.category]||0)+Number(x.amount));
 let ranked=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=ranked[0]?.[1]||1;
 let daily=Array.from({length:new Date().getDate()},(_,i)=>m.filter(x=>x.type==='expense'&&new Date(x.date).getDate()===i+1).reduce((a,x)=>a+Number(x.amount),0)),md=Math.max(...daily,1);
 let insights=[];if(ranked.length)insights.push(`Seu maior gasto do mês está em <b>${ranked[0][0]}</b>: ${money(ranked[0][1])}.`);
 let small=m.filter(x=>x.type==='expense'&&Number(x.amount)<30).reduce((a,x)=>a+Number(x.amount),0);if(small)insights.push(`Pequenos gastos abaixo de R$ 30 somam <b>${money(small)}</b> neste mês.`);
 let frequent=ranked.find(([c])=>m.filter(x=>x.type==='expense'&&x.category===c).length>=5);if(frequent)insights.push(`<b>${frequent[0]}</b> aparece com frequência: ${m.filter(x=>x.type==='expense'&&x.category===frequent[0]).length} lançamentos.`);
 document.getElementById('dashboard').innerHTML=`<div class="grid">
 <div class="card"><div class="label">Receitas</div><div class="value green">${money(inc)}</div></div><div class="card"><div class="label">Despesas</div><div class="value red">${money(exp)}</div></div><div class="card"><div class="label">Saldo</div><div class="value">${money(bal)}</div></div><div class="card"><div class="label">Média diária</div><div class="value">${money(exp/(new Date().getDate()||1))}</div></div></div>
 <div class="charts"><div class="card chart"><h2>Gastos por categoria</h2>${ranked.length?`<div class="bars">${ranked.slice(0,8).map(([c,v])=>`<div class="bar" style="height:${Math.max(4,v/max*190)}px"><span>${c}</span></div>`).join('')}</div>`:'<div class="empty">Adicione despesas para ver o gráfico.</div>'}</div>
 <div class="card"><h2>🧠 Onde o dinheiro está escapando?</h2>${insights.length?insights.map(i=>`<div class="insight">${i}</div>`).join(''):'<div class="empty">Ainda não há dados suficientes para analisar seus gastos.</div>'}</div></div>
 <div class="section card"><h2>Últimos lançamentos</h2>${table(m.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`;
 renderReports(ranked,daily,md);renderTransactions();renderGoals();renderSettings();
}
function table(arr){if(!arr.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${new Date(x.date+'T12:00').toLocaleDateString('pt-BR')}</td><td>${esc(x.description||'-')}</td><td><span class="pill">${esc(x.category)}</span></td><td>${x.type==='income'?'Receita':'Despesa'}</td><td class="${x.type==='income'?'green':'red'}">${money(x.amount)}</td><td><button class="tiny" onclick="editTx('${x.id}')">Editar</button><button class="tiny" onclick="del('${x.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
let filters={search:'',type:'all',category:'all'};
function renderTransactions(){let rows=data.filter(x=>(filters.type==='all'||x.type===filters.type)&&(filters.category==='all'||x.category===filters.category)&&(`${x.description||''} ${x.category} ${x.payment||''}`.toLowerCase().includes(filters.search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('transactions').innerHTML=`<div class="card"><h2>Movimentações</h2><div class="tools"><input aria-label="Buscar lançamento" placeholder="Buscar despesa ou receita" value="${esc(filters.search)}" oninput="filters.search=this.value;renderTransactions()"><select onchange="filters.type=this.value;renderTransactions()"><option value="all">Todos os tipos</option><option value="expense" ${filters.type==='expense'?'selected':''}>Despesas</option><option value="income" ${filters.type==='income'?'selected':''}>Receitas</option></select><select onchange="filters.category=this.value;renderTransactions()"><option value="all">Todas as categorias</option>${cats.map(c=>`<option ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><p class="label">${rows.length} lançamento(s) · ${money(rows.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0))} em despesas filtradas</p>${table(rows)}</div>`}
function renderReports(ranked,daily,md){let c=calc();document.getElementById('reports').innerHTML=`<div class="card"><h2>Relatório mensal</h2><p>Maior categoria: <b>${ranked[0]?.[0]||'—'}</b></p><p>Total de despesas: <b>${money(c.exp)}</b></p><p>Total de receitas: <b>${money(c.inc)}</b></p><p>Taxa de economia: <b>${c.inc?((c.bal/c.inc)*100).toFixed(1):0}%</b></p></div><div class="card section"><h2>Evolução diária</h2><div class="bars">${daily.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/md*190)}px"><span>${i+1}</span></div>`).join('')}</div></div>`}
function renderGoals(){document.getElementById('goals').innerHTML=`<div class="card"><h2>🎯 Metas</h2><button class="primary" onclick="addGoal()">＋ Nova meta</button>${goals.map((g,i)=>`<div class="insight"><b>${g.name}</b><br>${money(g.current)} de ${money(g.target)} — ${Math.min(100,g.current/g.target*100).toFixed(0)}%<br><button class="secondary" onclick="goals[i].current+=Number(prompt('Quanto adicionar?',0)||0);save();render()">Atualizar</button></div>`).join('')||'<div class="empty">Crie sua primeira meta financeira.</div>'}</div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><h2>⚙️ Configurações</h2><div class="notice">🔒 Este é um app pessoal. Seus dados ficam armazenados neste navegador e não exigem login.</div><p>Para manter seus dados seguros, faça backups periódicos usando a exportação.</p><h3>Categorias de despesas e receitas</h3><div class="tools"><input id="newCat" placeholder="Nova categoria (ex.: Pedidos)"><button class="primary" onclick="addCategory()">Adicionar categoria</button></div><div id="catList">${cats.map((c,i)=>`<div class="insight"><span>${esc(c)}</span> <button class="tiny" onclick="renameCategory(${i})">Renomear</button> <button class="tiny" onclick="removeCategory(${i})">Excluir</button></div>`).join('')}</div><h3>Seus dados</h3><button class="secondary" onclick="exportData()">Exportar backup (JSON)</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Importar backup</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"> <button class="danger" onclick="if(confirm('Apagar todos os dados? Esta ação não pode ser desfeita.')){data=[];goals=[];save();render()}">Apagar dados</button></div>`}
function show(id,btn){['dashboard','transactions','reports','goals','settings'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.getElementById('title').textContent={dashboard:'Visão geral',transactions:'Movimentações',reports:'Relatórios',goals:'Metas',settings:'Configurações'}[id];document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}
function openModal(){editId.value='';document.getElementById('modalTitle').textContent='Novo lançamento';document.querySelector('#modal form').reset();date.value=today;category.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join('');modal.classList.add('open')}
function editTx(id){let x=data.find(v=>v.id===id);if(!x)return;openModal();editId.value=x.id;document.getElementById('modalTitle').textContent='Editar lançamento';type.value=x.type;amount.value=x.amount;category.value=x.category;date.value=x.date;description.value=x.description||'';payment.value=x.payment||'Pix';recurring.checked=!!x.recurring}
function closeModal(){modal.classList.remove('open')}
function saveTx(e){e.preventDefault();let tx={id:editId.value||crypto.randomUUID(),type:type.value,amount:Number(amount.value),category:category.value,date:date.value,description:description.value,payment:payment.value,recurring:recurring.checked};let idx=data.findIndex(x=>x.id===tx.id);if(idx>=0)data[idx]=tx;else data.push(tx);save();e.target.reset();date.value=today;closeModal();render()}
function del(id){if(!confirm('Excluir este lançamento?'))return;data=data.filter(x=>x.id!==id);save();render()}
function addCategory(){let name=document.getElementById('newCat').value.trim();if(!name)return alert('Digite o nome da categoria.');if(cats.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('Esta categoria já existe.');cats.push(name);save();render()}
function renameCategory(i){let old=cats[i],name=prompt('Novo nome da categoria:',old)?.trim();if(!name||name===old)return;if(cats.some((c,j)=>j!==i&&c.toLowerCase()===name.toLowerCase()))return alert('Esta categoria já existe.');cats[i]=name;data.forEach(x=>{if(x.category===old)x.category=name});save();render()}
function removeCategory(i){let name=cats[i],count=data.filter(x=>x.category===name).length;if(count)return alert(`A categoria ${name} tem ${count} lançamento(s). Altere a categoria desses lançamentos antes de excluir.`);if(!confirm(`Excluir a categoria ${name}?`))return;cats.splice(i,1);save();render()}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.data)||!Array.isArray(obj.goals))throw Error('Formato inválido');if(!confirm('Importar o backup substituirá os dados atuais deste navegador. Continuar?'))return;data=obj.data;goals=obj.goals;cats=Array.isArray(obj.categories)?obj.categories: [...new Set([...defaultCats,...data.map(x=>x.category).filter(Boolean)])];save();render();alert('Backup importado com sucesso.')}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}}
function addGoal(){let name=prompt('Nome da meta');if(!name)return;let target=Number(prompt('Valor objetivo (R$)')||0);if(target>0){goals.push({name,target,current:0});save();render()}}
function exportData(){let blob=new Blob([JSON.stringify({data,goals,categories:cats},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-controle-financeiro-backup.json';a.click()}
render();
</script>
<script>
// Versão 2.0: extensão retrocompatível dos dados da versão 1.1.
const readSafe=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
let financeAccounts=readSafe('mcf_accounts_v2',[{id:'principal',name:'Carteira / conta principal',opening:0}]);
let budgets=readSafe('mcf_budgets_v2',{});
let selectedMonth=today.slice(0,7);
let planningFilter='all';
const persistV2=()=>{localStorage.setItem('mcf_accounts_v2',JSON.stringify(financeAccounts));localStorage.setItem('mcf_budgets_v2',JSON.stringify(budgets))};
const oldSave=save;
save=function(){oldSave();persistV2()};
const oldShow=show;
show=function(id,btn){if(['planning','accounts'].includes(id)){['dashboard','transactions','reports','goals','settings','planning','accounts'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.getElementById('title').textContent=id==='planning'?'Contas e vencimentos':'Contas e orçamentos';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');return}oldShow(id,btn);['planning','accounts'].forEach(x=>document.getElementById(x).style.display='none')};
const originalMonthData=monthData;
monthData=function(){return data.filter(x=>String(x.date||'').slice(0,7)===selectedMonth && (x.status||'paid')==='paid')};
const oldRender=render;
render=function(){oldRender();renderPlanning();renderAccounts();addDashboardExtras();addReportExtras();addSettingsExtras()};
const originalOpenModal=openModal;
function fillAccountSelect(){const el=document.getElementById('txAccount');el.innerHTML=financeAccounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
openModal=function(){originalOpenModal();fillAccountSelect();document.getElementById('txStatus').value='paid'};
const originalEditTx=editTx;
editTx=function(id){originalEditTx(id);const x=data.find(t=>t.id===id);fillAccountSelect();document.getElementById('txAccount').value=x?.accountId||financeAccounts[0]?.id||'';document.getElementById('txStatus').value=x?.status||'paid'};
const originalSaveTx=saveTx;
saveTx=function(e){const id=document.getElementById('editId').value;const accountId=document.getElementById('txAccount').value;const status=document.getElementById('txStatus').value;originalSaveTx(e);const tx=id?data.find(x=>x.id===id):data[data.length-1];if(tx){tx.accountId=accountId;tx.status=status;save();render()}};
const originalRenderTransactions=renderTransactions;
renderTransactions=function(){originalRenderTransactions();const el=document.getElementById('transactions');const bar=document.createElement('div');bar.className='tools';bar.innerHTML=`<label>Mês <input class="field" type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><button class="secondary" onclick="downloadCSV()">Exportar CSV</button><button class="secondary" onclick="show('planning')">Ver vencimentos</button>`;el.querySelector('.card').prepend(bar);const tableEl=el.querySelector('table tbody');if(tableEl){tableEl.querySelectorAll('tr').forEach(tr=>{const id=tr.querySelector('button[onclick^="editTx"]')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];const tx=data.find(x=>x.id===id);if(tx?.status==='pending'){const cell=tr.cells[3];if(cell)cell.innerHTML+='<div class="warn muted">Pendente</div>'}})}};
function monthSummary(month){const rows=data.filter(x=>String(x.date||'').slice(0,7)===month);const sum=(type,status)=>rows.filter(x=>x.type===type&&(x.status||'paid')===status).reduce((v,x)=>v+Number(x.amount||0),0);return {received:sum('income','paid'),spent:sum('expense','paid'),toReceive:sum('income','pending'),toPay:sum('expense','pending')}}
function addDashboardExtras(){const el=document.getElementById('dashboard');const s=monthSummary(selectedMonth);const pending=data.filter(x=>(x.status||'paid')==='pending'&&x.type==='expense');const late=pending.filter(x=>x.date<today);const coming=pending.filter(x=>x.date>=today&&x.date<=dateOffset(7));const monthInput=`<div class="tools"><label>Competência <input class="field" type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><button class="secondary" onclick="selectedMonth=today.slice(0,7);render()">Mês atual</button></div>`;el.insertAdjacentHTML('afterbegin',monthInput);el.insertAdjacentHTML('beforeend',`<div class="section grid"><div class="card"><div class="label">A pagar no mês</div><div class="value warn">${money(s.toPay)}</div></div><div class="card"><div class="label">A receber no mês</div><div class="value green">${money(s.toReceive)}</div></div><div class="card"><div class="label">Despesas vencidas</div><div class="value red">${money(late.reduce((a,x)=>a+Number(x.amount),0))}</div><div class="muted">${late.length} lançamento(s)</div></div><div class="card"><div class="label">Vencem em 7 dias</div><div class="value">${money(coming.reduce((a,x)=>a+Number(x.amount),0))}</div></div></div><div class="section card"><div class="flexline"><h2>Próximos vencimentos</h2><button class="secondary" onclick="show('planning')">Gerenciar</button></div>${table(pending.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5))}</div>`)}
function dateOffset(days){const d=new Date(today+'T12:00');d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderPlanning(){let rows=data.filter(x=>(x.status||'paid')==='pending'&&(planningFilter==='all'||x.type===planningFilter)).sort((a,b)=>a.date.localeCompare(b.date));const expense=rows.filter(x=>x.type==='expense');const late=expense.filter(x=>x.date<today);const total=expense.reduce((a,x)=>a+Number(x.amount),0);const next=(n)=>expense.filter(x=>x.date>=today&&x.date<=dateOffset(n)).reduce((a,x)=>a+Number(x.amount),0);document.getElementById('planning').innerHTML=`<div class="grid"><div class="card"><div class="label">Total pendente</div><div class="value">${money(total)}</div></div><div class="card"><div class="label">Atrasadas</div><div class="value red">${money(late.reduce((a,x)=>a+Number(x.amount),0))}</div></div><div class="card"><div class="label">Próximos 7 dias</div><div class="value">${money(next(7))}</div></div><div class="card"><div class="label">Próximos 30 dias</div><div class="value">${money(next(30))}</div></div></div><div class="card section"><div class="flexline"><h2>Agenda de pagamentos e recebimentos</h2><button class="primary" onclick="openModal();document.getElementById('txStatus').value='pending'">＋ Agendar</button></div><div class="tools"><select class="field" onchange="planningFilter=this.value;renderPlanning()"><option value="all" ${planningFilter==='all'?'selected':''}>Todos pendentes</option><option value="expense" ${planningFilter==='expense'?'selected':''}>Despesas</option><option value="income" ${planningFilter==='income'?'selected':''}>Recebimentos</option></select></div><div class="stack">${rows.map(x=>`<div class="insight"><div class="flexline"><div><b>${esc(x.description||x.category)}</b> · ${esc(x.category)}<div class="muted ${x.date<today?'overdue':''}">${esc(x.date.split('-').reverse().join('/'))} · ${x.date<today?'Atrasado':'Pendente'} · ${esc(x.payment||'')}</div></div><strong class="${x.type==='expense'?'red':'green'}">${money(x.amount)}</strong></div><div class="tools"><button class="tiny" onclick="settleTx('${x.id}')">${x.type==='expense'?'Marcar como pago':'Marcar como recebido'}</button><button class="tiny" onclick="editTx('${x.id}')">Editar</button><button class="tiny" onclick="del('${x.id}')">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum lançamento pendente.</div>'}</div></div>`}
function settleTx(id){const x=data.find(t=>t.id===id);if(!x||!confirm('Confirmar baixa deste lançamento?'))return;x.status='paid';save();render()}
function renderAccounts(){const accountRows=financeAccounts.map(a=>{const movement=data.filter(x=>(x.accountId||financeAccounts[0]?.id)===a.id&&(x.status||'paid')==='paid').reduce((v,x)=>v+(x.type==='income'?1:-1)*Number(x.amount||0),0);return `<div class="insight flexline"><div><b>${esc(a.name)}</b><div class="muted">Saldo inicial ${money(a.opening)}</div><strong>${money(Number(a.opening||0)+movement)}</strong></div><div><button class="tiny" onclick="editAccount('${a.id}')">Editar</button><button class="tiny" onclick="removeAccount('${a.id}')">Excluir</button></div></div>`}).join('');const monthExpenses=data.filter(x=>x.type==='expense'&&(x.status||'paid')==='paid'&&x.date?.slice(0,7)===selectedMonth);const catsToShow=[...new Set([...Object.keys(budgets),...monthExpenses.map(x=>x.category)])];document.getElementById('accounts').innerHTML=`<div class="card"><div class="flexline"><h2>Contas e carteiras</h2><button class="primary" onclick="addAccount()">＋ Nova conta</button></div><p class="muted">Os saldos consideram o saldo inicial e todos os lançamentos pagos/recebidos vinculados à conta.</p>${accountRows}</div><div class="card section"><div class="flexline"><h2>Limites de gastos por categoria</h2><label class="muted">Mês <input class="field" type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label></div><p class="muted">Os limites são mensais e podem ser alterados a qualquer momento.</p><div class="tools"><select class="field" id="budgetCat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input class="field" id="budgetValue" type="number" min="0" step="0.01" placeholder="Limite mensal R$"><button class="primary" onclick="setBudget()">Salvar limite</button></div>${catsToShow.map(c=>{const used=monthExpenses.filter(x=>x.category===c).reduce((v,x)=>v+Number(x.amount),0),limit=Number(budgets[c]||0),pct=limit?Math.round(used/limit*100):0;return `<div class="insight"><div class="flexline"><b>${esc(c)}</b><span>${money(used)} ${limit?' / '+money(limit):' (sem limite)'}</span></div>${limit?`<div class="progress"><div style="width:${Math.min(100,pct)}%;background:${pct>100?'#dc2626':'#111827'}"></div></div><div class="muted ${pct>100?'overdue':''}">${pct}% utilizado</div><button class="tiny" onclick="removeBudget('${encodeURIComponent(c)}')">Remover limite</button>`:''}</div>`}).join('')||'<div class="empty">Configure um limite para acompanhar seus gastos.</div>'}</div></div>`}
function addAccount(){const name=prompt('Nome da conta (ex.: Banco, Dinheiro, Cartão)')?.trim();if(!name)return;const opening=Number(prompt('Saldo inicial em R$','0'));if(!Number.isFinite(opening))return alert('Saldo inválido');financeAccounts.push({id:'a'+Date.now(),name,opening});save();render()}
function editAccount(id){const a=financeAccounts.find(x=>x.id===id);if(!a)return;const name=prompt('Nome da conta',a.name)?.trim();if(!name)return;const opening=Number(prompt('Saldo inicial em R$',a.opening));if(!Number.isFinite(opening))return alert('Saldo inválido');a.name=name;a.opening=opening;save();render()}
function removeAccount(id){if(financeAccounts.length===1)return alert('É necessário manter pelo menos uma conta.');if(data.some(x=>(x.accountId||financeAccounts[0]?.id)===id))return alert('Esta conta possui lançamentos. Edite os lançamentos antes de excluir.');if(!confirm('Excluir conta?'))return;financeAccounts=financeAccounts.filter(x=>x.id!==id);save();render()}
function setBudget(){const c=document.getElementById('budgetCat').value,v=Number(document.getElementById('budgetValue').value);if(!c||!Number.isFinite(v)||v<=0)return alert('Informe um limite maior que zero.');budgets[c]=v;save();render()}
function removeBudget(encoded){delete budgets[decodeURIComponent(encoded)];save();render()}
const oldRenameCategory=renameCategory;
renameCategory=function(i){const old=cats[i];oldRenameCategory(i);const next=cats[i];if(old!==next&&next){if(Object.hasOwn(budgets,old)){budgets[next]=budgets[old];delete budgets[old]}save();render()}};
const oldRemoveCategory=removeCategory;
removeCategory=function(i){const c=cats[i];oldRemoveCategory(i);if(!cats.includes(c)){delete budgets[c];save();render()}};
function addReportExtras(){const el=document.getElementById('reports');const s=monthSummary(selectedMonth);el.insertAdjacentHTML('afterbegin',`<div class="tools"><label>Período <input class="field" type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><button class="secondary" onclick="downloadCSV()">Exportar movimentações CSV</button></div><div class="card"><h2>Fluxo de caixa · ${selectedMonth}</h2><div class="grid"><div><div class="label">Recebido</div><b class="green">${money(s.received)}</b></div><div><div class="label">Pago</div><b class="red">${money(s.spent)}</b></div><div><div class="label">A receber</div><b>${money(s.toReceive)}</b></div><div><div class="label">A pagar</div><b>${money(s.toPay)}</b></div></div></div>`)}
function addSettingsExtras(){const el=document.getElementById('settings');el.querySelector('.card').insertAdjacentHTML('beforeend',`<h3>Exportações</h3><button class="secondary" onclick="downloadCSV()">Baixar CSV para Excel</button><p class="muted">Faça um backup JSON antes de trocar de celular, limpar o navegador ou reinstalar o aplicativo. Os dados não são sincronizados entre dispositivos.</p>`)}
function downloadCSV(){const columns=['Data','Tipo','Descrição','Categoria','Valor','Pagamento','Situação','Conta','Recorrente'];const lines=[columns,...data.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type==='income'?'Receita':'Despesa',x.description||'',x.category,Number(x.amount).toFixed(2).replace('.',','),x.payment||'',x.status||'paid',financeAccounts.find(a=>a.id===(x.accountId||financeAccounts[0]?.id))?.name||'',x.recurring?'Sim':'Não'])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='movimentacoes-financeiras.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const oldExportData=exportData;
exportData=function(){const blob=new Blob([JSON.stringify({version:2,data,goals,categories:cats,accounts:financeAccounts,budgets},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-controle-financeiro-backup-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
importData=async function(e){const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.data)||!Array.isArray(obj.goals)||!obj.data.every(x=>x&&typeof x==='object'&&['expense','income'].includes(x.type)&&Number.isFinite(Number(x.amount))&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error('Arquivo de backup inválido');if(!confirm('Importar substitui todos os dados atuais. Você já exportou seu backup?'))return;data=obj.data;goals=obj.goals;cats=Array.isArray(obj.categories)?obj.categories:[...new Set([...defaultCats,...data.map(x=>x.category).filter(Boolean)])];financeAccounts=Array.isArray(obj.accounts)&&obj.accounts.length?obj.accounts:[{id:'principal',name:'Carteira / conta principal',opening:0}];budgets=obj.budgets&&typeof obj.budgets==='object'&&!Array.isArray(obj.budgets)?obj.budgets:{};save();render();alert('Backup importado com sucesso.')}catch(err){alert('Falha na importação: '+err.message)}finally{e.target.value=''}};
const oldRenderGoals=renderGoals;
renderGoals=function(){oldRenderGoals();const el=document.getElementById('goals');el.querySelectorAll('.insight').forEach((node,i)=>{node.insertAdjacentHTML('beforeend',` <button class="tiny" onclick="editGoal(${i})">Editar</button> <button class="tiny" onclick="deleteGoal(${i})">Excluir</button>`)});};
function editGoal(i){const g=goals[i];if(!g)return;const name=prompt('Nome da meta',g.name)?.trim();if(!name)return;const target=Number(prompt('Objetivo em R$',g.target));if(!Number.isFinite(target)||target<=0)return alert('Valor inválido');const current=Number(prompt('Valor já guardado em R$',g.current));if(!Number.isFinite(current)||current<0)return alert('Valor inválido');Object.assign(g,{name,target,current});save();render()}
function deleteGoal(i){if(confirm('Excluir esta meta?')){goals.splice(i,1);save();render()}}
render();
</script>
